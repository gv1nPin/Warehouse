{% extends 'first/base.html' %}
{% load static %}

{% block title %}Товары{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'first/css/product-card.css' %}">
{% endblock %}

{% block content %}
    <h1>Товары</h1>
    <div class="card-list">
        {% for product in products %}
            {% include 'first/includes/product_card.html' with name=product.name price=product.price %}
        {% endfor %}
    </div>
{% endblock %}
